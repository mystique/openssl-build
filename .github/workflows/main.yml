name: Build OpenSSL

on:
  workflow_dispatch:
    inputs:
      openssl_url:
        description: 'OpenSSL download URL'
        required: true
        default: 'https://github.com/openssl/openssl/releases/download/openssl-3.5.4/openssl-3.5.4.tar.gz'
      install_prefix:
        description: 'Installation prefix path'
        required: true
        default: 'C:\OpenSSL'
      openssl_dir:
        description: 'OpenSSL directory path'
        required: true
        default: 'C:\OpenSSL\conf'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Setup VS2022
      uses: microsoft/setup-msbuild@v1.3
      with:
        vs-version: '17.0'

    - name: Setup Visual Studio Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
        vsversion: '2022'

    - name: Install NASM
      run: |
        choco install nasm -y
        echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        
    - name: Download OpenSSL source
      run: |
        Invoke-WebRequest -Uri ${{ inputs.openssl_url }} -OutFile openssl.tar.gz
      
    - name: Extract OpenSSL source
      run: |
        tar -xzf openssl.tar.gz
        $opensslDir = (Get-ChildItem -Directory -Name | Where-Object { $_ -match '^openssl-' } | Select-Object -First 1)
        echo "OPENSSL_DIR=$opensslDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "Extracted OpenSSL directory: $opensslDir"

    - name: Configure OpenSSL
      working-directory: ./${{ env.OPENSSL_DIR }}
      run: |
        perl Configure --prefix=${{ inputs.install_prefix }} --openssldir=${{ inputs.openssl_dir }}

    - name: Build OpenSSL
      working-directory: ./${{ env.OPENSSL_DIR }}
      run: nmake

    - name: Install OpenSSL
      working-directory: ./${{ env.OPENSSL_DIR }}
      run: nmake install

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.OPENSSL_DIR }}
        path: ${{ inputs.install_prefix }}
